<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Administrace – Železářství MT</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
  body{background:#ebe6dc;font-size:16px}
  .bar{background:var(--steel);color:#eee;border-bottom:3px solid var(--accent)}
  .bar .wrap{display:flex;align-items:center;gap:6px;height:58px;max-width:1080px}
  .bar .brand{font-size:20px;margin-right:auto;color:#fff}
  .bar a.t{color:#d9d4c8;text-decoration:none;font:600 15px/1 var(--head);letter-spacing:.06em;text-transform:uppercase;padding:9px 10px;border-radius:4px;cursor:pointer}
  .bar a.t.on,.bar a.t:hover{background:var(--steel-2);color:#fff}
  @media (max-width:560px){.bar .brand{font-size:17px}.bar a.t{padding:8px 6px;font-size:14px}}
  main.wrap{max-width:1080px;padding-top:28px;padding-bottom:60px}
  h1{font-size:40px;font-weight:800;text-transform:uppercase;margin-bottom:18px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px}
  .msg{padding:12px 16px;border-radius:6px;margin-bottom:18px;font-weight:600}
  .msg.ok{background:#dff1e4;color:#1f5c34}
  .msg.err{background:#fbe0d6;color:#8c2a0b}
  .tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .tools .sp{flex:1}
  .btn{font-size:16px;padding:11px 16px}
  .btn[disabled]{opacity:.6;cursor:wait}
  .btn-dark{background:var(--ink);color:#fff}
  .btn-line{border-color:var(--line);background:var(--card);color:var(--ink)}
  .btn-sm{font-size:14px;padding:7px 10px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{font:600 15px/1 var(--head);letter-spacing:.05em;text-transform:uppercase;padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);cursor:pointer}
  .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .items{display:flex;flex-direction:column;gap:8px}
  .item{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .item.hid{opacity:.55}
  .item .th{width:64px;height:64px;border-radius:5px;background:var(--paper-2);overflow:hidden;display:grid;place-items:center;color:#aaa;font-size:12px}
  .item .th img{width:100%;height:100%;object-fit:cover}
  .item b{font-size:17px;display:block}
  .item small{color:var(--ink-3)}
  .pill{display:inline-block;font:700 12px/1 var(--head);letter-spacing:.08em;text-transform:uppercase;padding:5px 7px;border-radius:3px;margin-left:6px;vertical-align:2px}
  .pill.orange{background:var(--tag);color:#3d3200}
  .pill.blue{background:#dbe7f7;color:#1d4a85}
  .pill.gray{background:#e3e0da;color:#6b6760}
  .pill.hidden{background:#3a3e44;color:#fff}
  .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  @media (max-width:700px){.item{grid-template-columns:56px 1fr}.item .th{width:56px;height:56px}.acts{grid-column:1/-1;justify-content:flex-start}}
  label.f{display:block;font-weight:600;margin-bottom:14px}
  label.f span{display:block;font-size:14px;color:var(--ink-2);margin-bottom:5px}
  input[type=text],input[type=password],input[type=date],input[type=email],input[type=search],select,textarea{width:100%;font:500 16px var(--body);padding:11px 12px;border:1.5px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
  textarea{min-height:110px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
  .cols3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 18px}
  @media (max-width:700px){.cols,.cols3{grid-template-columns:1fr}}
  .check{display:flex;gap:10px;align-items:center;font-weight:600;margin-bottom:14px;cursor:pointer}
  .check input{width:20px;height:20px;accent-color:var(--accent)}
  .salebox{background:#fff8d6;border:1.5px solid #ecd56b;border-radius:8px;padding:16px 16px 2px;margin-bottom:16px}
  .edit-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}
  @media (max-width:800px){.edit-grid{grid-template-columns:1fr}}
  .preview{aspect-ratio:4/3;background:var(--paper-2);border-radius:6px;display:grid;place-items:center;overflow:hidden;margin-bottom:10px;color:var(--ink-3)}
  .preview img{width:100%;height:100%;object-fit:contain;background:#fff}
  .login{max-width:380px;margin:10vh auto}
  fieldset{border:0;padding:0;margin:0 0 22px}
  legend{font:800 24px/1 var(--head);text-transform:uppercase;margin-bottom:14px}
  .hrow{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:center;margin-bottom:8px}
  .muted{color:var(--ink-3);font-size:14px}
  .loading{padding:40px;text-align:center;color:var(--ink-3)}
  .item{grid-template-columns:auto 64px 1fr auto}
  .item.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .pick{display:grid;place-items:center;padding:4px;cursor:pointer}
  .pick input,#selAll{width:20px;height:20px;accent-color:var(--accent)}
  @media (max-width:700px){.item{grid-template-columns:auto 56px 1fr}}
  .bulk{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding:10px 12px;margin-bottom:8px;border-radius:8px;border:1px dashed var(--line);font-size:15px}
  .bulk.on{background:var(--steel);color:#f3efe6;border:0;position:sticky;top:8px;z-index:5}
  .bulk.on .muted{color:#bbb}
  .bulk .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .bulk input[type=text],.bulk input[type=date]{padding:6px 8px;font-size:14px;width:auto}
  .bulk.on .btn-line{background:transparent;color:#f3efe6;border-color:#5a5f66}
  .imp-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media (max-width:800px){.imp-grid{grid-template-columns:1fr}}
  .drop{display:block;border:2px dashed var(--line);border-radius:8px;padding:30px 20px;text-align:center;cursor:pointer;background:#fff;line-height:1.7}
  .drop:hover,.drop.over{border-color:var(--accent);background:#fff6f2}
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
  table.pv{width:100%;border-collapse:collapse;font-size:14.5px;background:#fff}
  table.pv th{text-align:left;font:700 13px/1 var(--head);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:10px;border-bottom:1px solid var(--line);background:var(--paper)}
  table.pv td{padding:9px 10px;border-top:1px solid #eee8dd;vertical-align:top}
  table.pv .r{text-align:right;white-space:nowrap}
  table.pv tr.bad td{background:#fdf0eb}
  .errtxt{color:#8c2a0b;font-size:13px;font-weight:600;margin-top:3px}
  .pill.ok{background:#dff1e4;color:#1f5c34}
  .pill.err{background:#fbe0d6;color:#8c2a0b}
  table.pv .pill{margin:0}
  .photos{margin-top:12px;display:flex;flex-direction:column;gap:4px;font-size:14.5px}
  .ph{display:grid;grid-template-columns:1fr 1.3fr 140px;gap:10px;padding:6px 10px;background:#fff;border-radius:5px}
  .ph.miss{color:var(--ink-3)}
  .ph .st{text-align:right;font-weight:600}
</style>
</head>
<body>
<div id="app"><div class="loading">Načítám…</div></div>
<script type="module" src="/assets/admin.js"></script>
</body>
</html>
